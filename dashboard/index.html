<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Automation Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      background: #f4f6f9;
      color: #111827;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Layout ─────────────────────────────────────────────────── */
    .app-layout { display: flex; min-height: 100vh; }
    .app-main   { flex: 1; overflow-y: auto; }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: #1e293b;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-brand {
      font-size: 15px;
      font-weight: 700;
      padding: 0 20px 16px;
      color: #fff;
    }

    .sidebar-brand small { display: block; font-weight: 400; font-size: 11px; color: #94a3b8; margin-top: 2px; }

    .sidebar-search { padding: 0 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 8px; }
    .sidebar-search input {
      width: 100%; padding: 7px 10px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06); color: #f1f5f9; font-size: 12px; outline: none;
    }
    .sidebar-search input::placeholder { color: #64748b; }
    .sidebar-search input:focus { border-color: #6366f1; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      color: #94a3b8;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-size: 13px;
    }

    .nav-item:hover  { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,0.1);  color: #fff; }
    .nav-soon { margin-left: auto; font-size: 9px; background: rgba(255,255,255,0.12); padding: 1px 6px; border-radius: 99px; color: #cbd5e1; }

    /* ── Page ─────────────────────────────────────────────────────── */
    .page       { padding: 36px 40px; max-width: 1340px; }
    .page-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
    .page-title { font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px; }
    .page-subtitle { color: #6b7280; font-size: 13px; margin: 4px 0 20px; max-width: 640px; }

    .page-state      { padding: 48px 32px; text-align: center; color: #6b7280; font-size: 15px; }
    .page-state.error { color: #dc2626; }

    /* ── Hero ─────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #111827 0%, #312e81 100%);
      border-radius: 16px;
      padding: 28px 32px;
      color: #fff;
      margin-bottom: 24px;
    }
    .hero-title { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
    .hero-subtitle { font-size: 12.5px; color: #c7d2fe; margin-top: 4px; }
    .hero .context-bar { margin: 16px 0 0; }
    .hero .ctx-badge { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); color: #e5e7eb; }

    /* ── Context bar ──────────────────────────────────────────────── */
    .context-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 24px; }
    .ctx-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 99px;
      padding: 5px 12px; font-size: 12px; font-weight: 600; color: #374151;
    }
    .ctx-badge .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Buttons ──────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; transition: .15s; white-space: nowrap;
    }
    .btn-primary   { background: #2563eb; color: #fff; }
    .btn-primary:hover   { background: #1d4ed8; }
    .btn-secondary { background: #fff; border-color: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #f9fafb; }
    .btn.on-dark { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); color: #fff; }
    .btn.on-dark:hover { background: rgba(255,255,255,0.2); }
    .btn-theme { padding: 14px 26px; font-size: 14.5px; }
    .btn-theme svg { flex-shrink: 0; }
    .qa-blue    { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .qa-blue svg    { color: #60a5fa; }
    .qa-blue:hover  { background: #dbeafe; }
    .qa-purple  { background: #f5f3ff; border-color: #ddd6fe; color: #6d28d9; }
    .qa-purple svg  { color: #a78bfa; }
    .qa-purple:hover{ background: #ede9fe; }
    .qa-teal    { background: #f0fdfa; border-color: #99f6e4; color: #0f766e; }
    .qa-teal svg    { color: #2dd4bf; }
    .qa-teal:hover  { background: #ccfbf1; }
    .qa-orange  { background: #fff7ed; border-color: #fed7aa; color: #c2410c; }
    .qa-orange svg  { color: #fb923c; }
    .qa-orange:hover{ background: #ffedd5; }
    .btn.soon { opacity: .55; cursor: not-allowed; }
    .quick-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

    /* ── Sections / Cards ─────────────────────────────────────────── */
    .section { margin-bottom: 28px; }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 2px rgba(16,24,40,0.04);
      padding: 22px 26px;
      transition: box-shadow .15s;
    }
    .card:hover { box-shadow: 0 4px 12px rgba(16,24,40,0.06); }

    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #0f172a; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .card-header .card-title { margin-bottom: 0; }
    .card-meta { font-size: 11px; color: #9ca3af; font-weight: 500; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-2 > * { height: 100%; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

    /* ── Quality / Health Score Ring ──────────────────────────────── */
    .score-card { display: flex; align-items: center; gap: 24px; }
    .score-ring {
      display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100px; height: 100px; border-radius: 50%;
      border: 7px solid var(--score-color, #16a34a); background: #fff; flex-shrink: 0;
    }
    .score-value { font-size: 24px; font-weight: 700; line-height: 1; }
    .score-label { font-size: 10px; color: #6b7280; margin-top: 4px; }

    .info-tip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; border-radius: 50%;
      background: #e5e7eb; color: #4b5563; font-size: 10px; font-weight: 700;
      cursor: help; margin-left: 6px; flex-shrink: 0;
    }
    .score-explain { font-size: 12.5px; color: #6b7280; line-height: 1.6; }
    .score-explain b { color: #111827; }

    /* ── KPI Cards ────────────────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
    @media (max-width: 1100px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px)  { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
    .kpi-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #111827; }
    .kpi-label { font-size: 11.5px; color: #6b7280; font-weight: 500; }

    /* ── Info Grid ────────────────────────────────────────────────── */
    .info-grid  { display: flex; flex-direction: column; gap: 9px; }
    .info-row   { display: flex; gap: 12px; font-size: 13px; }
    .info-label { width: 120px; flex-shrink: 0; color: #6b7280; font-weight: 500; }
    .info-value { color: #111827; }

    /* ── Status pills / badges ────────────────────────────────────── */
    .status-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .status-pass  { background: #f0fdf4; color: #16a34a; font-weight: 600; }
    .status-fail  { background: #fef2f2; color: #dc2626; font-weight: 600; }
    .status-warn  { background: #fef3c7; color: #92400e; }
    .status-muted { background: #f3f4f6; color: #6b7280; }

    .release-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 10px; font-size: 15px; font-weight: 700; letter-spacing: .5px; }
    .release-ready   { background: #16a34a18; color: #16a34a; border: 1px solid #16a34a44; }
    .release-blocked { background: #dc262618; color: #dc2626; border: 1px solid #dc262644; }
    .release-review  { background: #d9770618; color: #d97706; border: 1px solid #d9770644; }

    .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: .3px; }
    .badge-fail, .badge-failed { background: #fee2e2; color: #b91c1c; }
    .badge-passed { background: #dcfce7; color: #15803d; }
    .badge-skipped { background: #f3f4f6; color: #6b7280; }
    .badge-flaky { background: #fef3c7; color: #92400e; }

    /* ── Tables ───────────────────────────────────────────────────── */
    .data-table, .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .results-table th { text-align: left; padding: 9px 12px; font-weight: 600; color: #6b7280; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
    .data-table td, .results-table td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
    .data-table tr:last-child td, .results-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td, .results-table tr:hover td { background: #f9fafb; }

    .test-name { max-width: 280px; word-break: break-word; font-family: monospace; font-size: 12px; }
    .error-msg { max-width: 400px; color: #dc2626; word-break: break-word; }
    .error-msg-clamp {
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; font-size: 12.5px; font-family: monospace; line-height: 1.5; cursor: help;
    }
    .link      { color: #2563eb; text-decoration: underline; }
    .muted     { color: #9ca3af; }

    /* ── Filter bar ───────────────────────────────────────────────── */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filter-bar input, .filter-bar select {
      padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px;
      background: #fff; color: #111827; outline: none;
    }
    .filter-bar input { flex: 1; min-width: 200px; }
    .filter-bar input:focus, .filter-bar select:focus { border-color: #6366f1; }
    .filter-bar label { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; margin-right: -4px; }

    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-chip { padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151; cursor: pointer; }
    .filter-chip:hover { background: #e0e7ff; border-color: #6366f1; color: #4338ca; }
    .filter-chip.active { background: #4f46e5; border-color: #4f46e5; color: #fff; }

    .tag-pill { display: inline-flex; align-items: center; gap: 6px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; padding: 3px 8px; font-family: monospace; font-size: 12px; color: #374151; cursor: pointer; white-space: nowrap; }
    .tag-pill:hover { background: #e0e7ff; border-color: #6366f1; color: #4338ca; }
    .tag-pill.copied { background: #dcfce7; border-color: #16a34a; color: #15803d; }
    .copy-icon { font-size: 11px; opacity: 0.6; }

    .count-badge { display: inline-block; background: #e5e7eb; color: #374151; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; margin-left: 8px; }

    /* ── Mini run rows (homepage recent history) ─────────────────── */
    .mini-run-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
    .mini-run-row:last-child { border-bottom: none; }
    .mini-run-suite { font-weight: 600; color: #111827; min-width: 140px; }
    .mini-run-meta  { color: #9ca3af; font-size: 12px; flex: 1; }

    /* ── Analytics ────────────────────────────────────────────────── */
    .chart-container { width: 100%; }

    .fail-group-hdr { font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; padding: 14px 0 6px; }
    .fail-group-hdr:first-child { padding-top: 0; }

    .fail-row { border-bottom: 1px solid #f3f4f6; }
    .fail-row:last-child { border-bottom: none; }
    .fail-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 0; cursor: pointer; }
    .fail-hdr:hover { background: #f9fafb; margin: 0 -4px; padding: 10px 4px; border-radius: 6px; }
    .fail-name { flex: 1; font-family: monospace; font-size: 12px; color: #111827; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
    .fail-chev { color: #9ca3af; transition: transform .2s; font-size: 12px; }
    .fail-chev.open { transform: rotate(180deg); }
    .fail-body { display: none; padding: 0 0 10px 30px; font-size: 11px; color: #dc2626; font-family: monospace; line-height: 1.6; white-space: pre-wrap; }
    .fail-body.open { display: block; }
    .fail-extra { display: none; padding: 4px 0 12px 30px; font-size: 11.5px; color: #6b7280; }
    .fail-extra.open { display: block; }
    .fail-extra .info-row { font-size: 11.5px; }
    .fail-extra .info-label { width: 100px; }

    /* Top Failures / Slow Tests as cards */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .fail-card, .slow-card {
      border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; background: #fff;
      display: flex; flex-direction: column; gap: 6px;
    }
    .fail-card-title { font-weight: 700; font-size: 13px; color: #111827; }
    .fail-card-meta { font-size: 11.5px; color: #6b7280; }
    .fail-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11.5px; }

    .flaky-bar-bg   { height: 6px; background: #f3f4f6; border-radius: 3px; flex: 1; }
    .flaky-bar-fill { height: 6px; background: #d97706; border-radius: 3px; }

    .empty-note { color: #9ca3af; font-size: 13px; padding: 32px; text-align: center; }

    /* ── Coming soon / placeholder pages ─────────────────────────── */
    .soon-card { border: 1px dashed #d1d5db; border-radius: 12px; padding: 22px 26px; background: #fafafa; color: #6b7280; }
    .soon-card b { color: #374151; }

    @media (max-width: 900px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .score-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-brand">QA Automation Platform</div>
      <div class="sidebar-search">
        <input id="global-search" type="text" placeholder="Search runs, branch, user…" />
      </div>
      <a class="nav-item" data-page="home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a class="nav-item" data-page="runs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
        Runs
      </a>
      <a class="nav-item" data-page="failures">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Failures
      </a>
      <a class="nav-item" data-page="tests">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Tests
      </a>
      <a class="nav-item" data-page="analytics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analytics
      </a>
      <a class="nav-item" data-page="compare">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v18M16 3v18M3 9h5M16 9h5M3 15h5M16 15h5"/></svg>
        Compare Runs
      </a>
      <a class="nav-item" data-page="artifacts">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        Logs
      </a>
      <a class="nav-item" data-page="bookmarks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Bookmarks
      </a>
      <a class="nav-item" data-page="schedules">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Schedules
        <span class="nav-soon">Soon</span>
      </a>
    </nav>
    <main class="app-main" id="main"></main>
  </div>

  <script>
    // ── Data ──────────────────────────────────────────────────────────────────
    let latestRun = null;
    let history   = [];

    // ── Repo context (derived from the GitHub Pages URL — no backend calls) ──
    function getRepoContext() {
      const host = window.location.hostname; // e.g. snehayt.github.io
      const path = window.location.pathname.split('/').filter(Boolean);
      const owner = host.endsWith('.github.io') ? host.split('.')[0] : 'snehayt';
      const repo  = path[0] || 'ccfeds-automation';
      return { owner, repo };
    }
    const REPO = getRepoContext();
    const ACTIONS_URL   = `https://github.com/${REPO.owner}/${REPO.repo}/actions/workflows/run-tests.yml`;
    const DASHBOARD_URL = `https://${REPO.owner}.github.io/${REPO.repo}/`;
    // Real schedule already defined in run-tests.yml — shown as-is, not fabricated.
    const KNOWN_CRON = { expr: '0 3 * * *', label: '8:30 AM IST, every day' };

    async function fetchJSON(paths) {
      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (!res.ok) continue;
          const text = await res.text();
          if (text.trim()) return JSON.parse(text);
        } catch (_) {}
      }
      return null;
    }

    async function loadData() {
      const t = Date.now();
      const [run, hist] = await Promise.all([
        fetchJSON([`./nala-results.json?t=${t}`,  `../nala-results.json?t=${t}`]),
        fetchJSON([`./run-history.json?t=${t}`,   `../run-history.json?t=${t}`]),
      ]);
      if (run)  latestRun = run;
      if (hist) history   = Array.isArray(hist) ? hist : [];
      render();
    }

    // ── Router ─────────────────────────────────────────────────────────────
    function getRoute() {
      const raw = window.location.hash.replace('#', '') || 'home';
      const [page, param] = raw.split('/');
      return { page, param };
    }
    function navigate(page) { window.location.hash = page; }

    window.addEventListener('hashchange', render);
    window.addEventListener('resize', () => {
      if (window.__analyticsCharts) window.__analyticsCharts.forEach(c => c.resize());
    });

    // ── Render ─────────────────────────────────────────────────────────────
    function render() {
      const { page, param } = getRoute();

      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });

      const main = document.getElementById('main');
      if      (page === 'home')       { main.innerHTML = renderHome(); wireHome(); }
      else if (page === 'runs')       { main.innerHTML = renderRuns(); wireRuns(); }
      else if (page === 'run')        { main.innerHTML = renderRunDetails(param); wireRunDetails(); loadFullResultsIfNeeded(param); }
      else if (page === 'failures')   main.innerHTML = renderFailures();
      else if (page === 'tests')      { main.innerHTML = renderTests(); wireTests(); }
      else if (page === 'analytics')  { main.innerHTML = renderAnalytics(); wireAnalytics(); }
      else if (page === 'compare')    { main.innerHTML = renderCompare(); wireCompare(); }
      else if (page === 'artifacts')  main.innerHTML = renderArtifacts();
      else if (page === 'bookmarks')  main.innerHTML = renderBookmarks();
      else if (page === 'schedules')  { main.innerHTML = renderSchedules(); wireSchedules(); }
      else                            main.innerHTML = renderHome();
    }

    // ── Shared bits ──────────────────────────────────────────────────────────
    function contextBar(run, opts = {}) {
      if (!run) return '';
      const items = [
        ['suite', run.suite],
        ['env', run.environment],
        ['browser', run.browser],
        ['device', run.device],
      ];
      if (opts.full) {
        if (run.timestamp) items.push(['updated', new Date(run.timestamp).toLocaleString()]);
      } else if (run.locale) {
        items.push(['locale', run.locale]);
      }
      return `<div class="context-bar">${items.filter(([, v]) => v).map(([label, value]) => `
        <span class="ctx-badge">${esc(label)}: ${esc(String(value))}</span>
      `).join('')}</div>`;
    }

    function runSuitesBtn(cls = 'btn-primary') {
      return `<a class="btn ${cls}" href="${ACTIONS_URL}" target="_blank" rel="noopener">▶ Run Suites</a>`;
    }

    function soonBtn(label) {
      return `<span class="btn btn-secondary soon" title="Not available yet">${esc(label)}</span>`;
    }

    // ── Home Page ───────────────────────────────────────────────────────────
    // The homepage is scoped to one suite at a time. It defaults to whichever
    // suite the globally-latest completed run belongs to, but a run triggered
    // by someone else, for a different suite, won't silently take over what
    // you're looking at — you pick the suite explicitly, and it's remembered
    // per suite from run-history.json (+ the full per-run JSON when cached).
    let homeSelectedSuite = null;

    function wireHome() {
      document.getElementById('home-suite-select')?.addEventListener('change', (e) => {
        homeSelectedSuite = e.target.value || null;
        render();
      });
      maybeLoadHomeResults();
    }

    function getActiveHomeSummary() {
      if (!latestRun) return null;
      const activeSuite = homeSelectedSuite || latestRun.suite;
      if (activeSuite === latestRun.suite) return latestRun;
      return history.find(h => h.suite === activeSuite) || latestRun;
    }

    async function maybeLoadHomeResults() {
      const summary = getActiveHomeSummary();
      if (!summary || summary === latestRun || getFullResults(summary) || !summary.resultsUrl) return;
      const t = Date.now();
      const data = await fetchJSON([`./${summary.resultsUrl}?t=${t}`, `../${summary.resultsUrl}?t=${t}`]);
      if (data && Array.isArray(data.results)) {
        resultsCache[summary.resultsUrl] = data.results;
        if (getRoute().page === 'home' && getActiveHomeSummary() === summary) render();
      }
    }

    function renderHome() {
      if (!latestRun) {
        return `<div class="page">
          <h1 class="page-title">Dashboard</h1>
          <div class="quick-actions section">${runSuitesBtn()}</div>
          <div class="page-state">No run data yet. Click <b>Run Suites</b> above to trigger the first run from GitHub Actions.</div>
        </div>`;
      }

      const suitesAvail = [...new Set([latestRun.suite, ...history.map(h => h.suite)].filter(Boolean))];
      const run = getActiveHomeSummary();
      const isGlobalLatest = run === latestRun;

      const { suite, environment, browser, triggeredBy, runUrl } = run;
      const passed = run.passed ?? 0, failed = run.failed ?? 0, skipped = run.skipped ?? 0, total = run.total ?? 0;

      const activeResults = isGlobalLatest ? (run.results || []) : (getFullResults(run) || []);
      const resultsReady  = isGlobalLatest || Array.isArray(run.results) || !!getFullResults(run);
      const loadingResults = !resultsReady && !!run.resultsUrl;

      const passRate    = total > 0 ? ((passed / total) * 100).toFixed(1) : '0';
      const passRateColor = total === 0 ? '#6b7280' : passRate >= 85 ? '#16a34a' : passRate >= 60 ? '#d97706' : '#dc2626';
      const failures    = resultsReady ? activeResults.filter(r => r.status === 'failed') : [];
      const totalMs     = resultsReady ? activeResults.reduce((sum, r) => sum + (r.duration || 0), 0) : null;
      const slowest     = resultsReady ? [...activeResults].filter(r => r.duration > 0).sort((a,b) => b.duration - a.duration).slice(0, 3) : [];
      const runStatus   = failed > 0
        ? `<span class="status-pill status-fail">${failed} failed</span>`
        : `<span class="status-pill status-pass">Passed</span>`;

      // ── Pass-rate delta vs the previous run of the same suite — folded
      // into the Run Status card as one line, instead of its own box.
      const sameSuiteHistory = history.filter(h => h.suite === suite);
      const runIsSameAsFirstHistoryEntry = sameSuiteHistory[0] && sameSuiteHistory[0].runId === run.runId;
      const prevRun = runIsSameAsFirstHistoryEntry ? sameSuiteHistory[1] : sameSuiteHistory[0];
      const prevPassRate = prevRun && prevRun.total ? (prevRun.passed / prevRun.total) * 100 : null;
      const trendTxt = prevPassRate == null
        ? 'No earlier run of this suite yet'
        : `${deltaLabel(+((total > 0 ? (passed/total)*100 : 0) - prevPassRate).toFixed(1))} pass rate vs previous ${esc(suite)} run`;

      const slowRows = slowest.map(t => `
        <div class="mini-run-row">
          <span class="mini-run-suite" style="font-family:monospace;font-size:12px;font-weight:500" title="${esc(t.name)}">${esc(shortTestLabel(t.name))}</span>
          <span class="mini-run-meta"></span>
          <span style="font-weight:600;color:${t.duration > 15000 ? '#dc2626' : t.duration > 8000 ? '#d97706' : '#374151'}">${(t.duration/1000).toFixed(1)}s</span>
        </div>
      `).join('');

      const runStatusSection = `
        <section class="section card">
          <div class="card-header">
            <span class="card-title">Run Status</span>
            ${runStatus}
          </div>
          <div style="display:flex;align-items:center;gap:8px;color:#6b7280;font-size:12.5px;margin-bottom:16px">
            <span class="status-pill status-muted">No active execution</span>
            <span>— check the <a href="${ACTIONS_URL}" target="_blank" class="link">Actions run list</a> for anything currently in flight.</span>
          </div>
          <div class="info-grid">
            ${infoRow('Suite',        suite)}
            ${infoRow('Environment',  environment)}
            ${infoRow('Browser',      browser)}
            ${infoRow('Duration',     loadingResults ? 'Loading…' : formatDuration(totalMs))}
            ${infoRow('Triggered By', triggeredBy)}
            ${infoRow('Trend',        trendTxt)}
          </div>
          <div style="margin-top:14px"><a href="#run/${isGlobalLatest ? 'latest' : history.indexOf(run)}" class="link">Open Run →</a></div>

          ${slowest.length > 0 ? `
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid #f3f4f6">
            <div class="card-header" style="margin-bottom:6px"><span class="card-title" style="font-size:13px">Slowest Tests</span></div>
            ${slowRows}
          </div>` : ''}
        </section>
      `;

      const recentResults = resultsReady ? activeResults.slice(0, 6) : [];
      const resultRows = recentResults.map((t, i) => {
        const id = `home-${i}`;
        const isFail = t.status === 'failed';
        return `
        <div class="fail-row">
          <div class="fail-hdr" ${isFail ? `onclick="toggleFail('${id}')" style="cursor:pointer"` : 'style="cursor:default"'}>
            <span class="badge badge-${isFail ? 'fail' : 'passed'}">${isFail ? 'FAIL' : 'PASS'}</span>
            <span class="fail-name" title="${esc(t.name)}">${esc(shortTestLabel(t.name || t.title))}</span>
            <span class="muted" style="margin-left:auto">${t.duration ? (t.duration/1000).toFixed(1)+'s' : '—'}</span>
            ${isFail ? `<span class="fail-chev" id="chev-${id}">▼</span>` : ''}
          </div>
          ${isFail ? `<div class="fail-body" id="fail-body-${id}">${esc(t.errorMessage || 'No error message captured.')}</div>` : ''}
        </div>`;
      }).join('');

      const failuresSection = `
        <section class="section card">
          <div class="card-header">
            <span class="card-title">Recent Results</span>
            <a href="#failures" class="link" style="font-size:12px">View all failures →</a>
          </div>
          ${loadingResults ? `<div class="empty-note">Loading test results…</div>`
            : recentResults.length > 0 ? resultRows
            : `<div class="empty-note">No test results for this run.</div>`}
        </section>
      `;

      return `
        <div class="page">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Dashboard</h1>
              <p class="page-subtitle">Centralized visibility and execution history for automation.</p>
            </div>
            ${runSuitesBtn()}
          </div>

          <div class="filter-bar" style="margin-bottom:8px">
            <label>Suite</label>
            <select id="home-suite-select">
              ${suitesAvail.map(s => `<option value="${esc(s)}" ${s === suite ? 'selected' : ''}>${esc(s)}${s === latestRun.suite ? ' (latest overall)' : ''}</option>`).join('')}
            </select>
          </div>

          <div class="quick-actions section">
            ${quickActionBtn('calendar', 'Schedules', '#schedules', false, 'qa-blue')}
            ${quickActionBtn('chart', 'Analytics', '#analytics', false, 'qa-purple')}
            ${quickActionBtn('report', 'Latest Run', runUrl, true, 'qa-teal')}
            ${quickActionBtn('bars', 'Compare Runs', '#compare', false, 'qa-orange')}
          </div>

          <section class="section kpi-grid">
            ${kpiCard('Pass Rate',   passRate + '%', passRateColor)}
            ${kpiCard('Duration',    loadingResults ? '…' : formatDuration(totalMs))}
            ${kpiCard('Tests Executed', total)}
            ${kpiCard('Passed',      passed,  '#16a34a')}
            ${kpiCard('Failed',      failed,  failed > 0 ? '#dc2626' : '#16a34a')}
            ${kpiCard('Skipped',     skipped, '#6b7280')}
          </section>

          <div class="grid-2">
            ${runStatusSection}
            ${failuresSection}
          </div>
        </div>
      `;
    }

    const QUICK_ICONS = {
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      star: '<path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/>',
      report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6M9 9h1"/>',
      bars: '<path d="M8 3v18M16 3v18M3 9h5M16 9h5M3 15h5M16 15h5"/>',
      chart: '<path d="M3 3v18h18"/><path d="M7 16l4-5 3 3 5-7"/>',
    };
    function quickActionBtn(icon, label, href, external, colorCls = '') {
      const svg = `<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${QUICK_ICONS[icon] || ''}</svg>`;
      if (!href) return `<span class="btn btn-theme ${colorCls} soon" title="No run URL available for this run">${svg}${esc(label)}</span>`;
      return `<a class="btn btn-theme ${colorCls}" href="${href}"${external ? ' target="_blank" rel="noopener"' : ''}>${svg}${esc(label)}</a>`;
    }

    // ── Runs Page ───────────────────────────────────────────────────────────
    function renderRuns() {
      const header = `
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Runs</h1>
            <p class="page-subtitle">Full execution history across every triggered suite.</p>
          </div>
          ${runSuitesBtn()}
        </div>
      `;

      if (history.length === 0) {
        return `<div class="page">${header}<div class="page-state">No runs yet.</div></div>`;
      }

      const bookmarkedRuns = getRunBookmarks();

      const rows = history.map((run, i) => {
        const total = run.total ?? 0;
        const passed = run.passed ?? 0;
        const nothingRan = passed === 0 && (run.failed ?? 0) === 0;
        const statusPill = nothingRan
          ? `<span class="status-pill status-warn">${passed}/${total} passed</span>`
          : run.failed > 0
            ? `<span class="status-pill status-fail">${passed}/${total} passed</span>`
            : `<span class="status-pill status-pass">${passed}/${total} passed</span>`;
        const runKey = run.runId || String(i);
        const isBookmarked = bookmarkedRuns.includes(runKey);

        return `
          <tr data-suite="${esc((run.suite || '').toLowerCase())}" data-env="${esc((run.environment || '').toLowerCase())}" data-triggered="${esc((run.triggeredBy || '').toLowerCase())}" data-branch="${esc((run.branch || '').toLowerCase())}">
            <td><a href="#run/${i}" class="link">#${esc(runKey)}</a></td>
            <td>${statusPill}</td>
            <td>${esc(run.suite)}</td>
            <td>${esc(run.environment)}</td>
            <td>${esc(run.browser)}</td>
            <td>${esc(run.device || '—')}</td>
            <td>${esc(run.locale || '—')}</td>
            <td>${esc(run.triggeredBy)}</td>
            <td>${total}</td>
            <td style="color:#16a34a">${passed}</td>
            <td style="color:${run.failed > 0 ? '#dc2626' : 'inherit'}">${run.failed ?? 0}</td>
            <td>${run.timestamp ? new Date(run.timestamp).toLocaleString() : '—'}</td>
            <td>
              <a href="#run/${i}" class="link">Open</a>
              <a href="#compare?a=${i}" class="link" style="margin-left:8px">Compare</a>
              <span class="tag-pill" style="margin-left:8px" onclick="toggleRunBookmark('${esc(runKey)}', this)">${isBookmarked ? '★' : '☆'}</span>
            </td>
          </tr>`;
      }).join('');

      return `
        <div class="page">
          ${header}
          <div class="filter-bar">
            <input id="runs-search" type="text" placeholder="Search by suite, environment, branch, triggered by…" />
          </div>
          <section class="section card">
            <div style="overflow-x:auto">
            <table class="data-table" id="runs-table">
              <thead>
                <tr>
                  <th>Run ID</th><th>Status</th><th>Suite</th><th>Environment</th><th>Browser</th>
                  <th>Device</th><th>Locale</th><th>Triggered By</th>
                  <th>Total</th><th>Passed</th><th>Failed</th>
                  <th>Timestamp</th><th>Actions</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
            </div>
          </section>
        </div>
      `;
    }

    function wireRuns() {
      document.getElementById('runs-search')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('#runs-table tbody tr').forEach(row => {
          const hay = ['suite', 'env', 'triggered', 'branch'].map(k => row.dataset[k] || '').join(' ');
          row.style.display = !q || hay.includes(q) ? '' : 'none';
        });
      });
      applyPendingSearch('runs-search', filterRunsTable);
    }
    function filterRunsTable() {
      document.getElementById('runs-search')?.dispatchEvent(new Event('input'));
    }

    // ── Run Details Page ────────────────────────────────────────────────────
    const resultsCache = {}; // resultsUrl -> full results[] fetched on demand

    function getFullResults(run) {
      if (Array.isArray(run.results)) return run.results;
      if (run.resultsUrl && resultsCache[run.resultsUrl]) return resultsCache[run.resultsUrl];
      return null;
    }

    async function loadFullResultsIfNeeded(param) {
      const isLatest = param === 'latest' || param == null;
      const run = isLatest ? latestRun : history[Number(param)];
      if (!run || getFullResults(run) || !run.resultsUrl) return;
      const t = Date.now();
      const data = await fetchJSON([`./${run.resultsUrl}?t=${t}`, `../${run.resultsUrl}?t=${t}`]);
      if (data && Array.isArray(data.results)) {
        resultsCache[run.resultsUrl] = data.results;
        const cur = getRoute();
        if (cur.page === 'run' && String(cur.param) === String(param)) render();
      }
    }

    function wireRunDetails() {} // reserved for future per-run interactivity

    function renderRunDetails(param) {
      const isLatest = param === 'latest' || param == null;
      const run = isLatest ? latestRun : history[Number(param)];

      if (!run) {
        return `<div class="page"><div class="page-state">Run not found.</div></div>`;
      }

      const results  = getFullResults(run) || [];
      const hasResults = results.length > 0 || Array.isArray(run.results);
      const loadingResults = !hasResults && run.resultsUrl;
      const passed  = run.passed ?? results.filter(r => r.status === 'passed').length;
      const failed  = run.failed ?? results.filter(r => r.status === 'failed').length;
      const skipped = run.skipped ?? results.filter(r => r.status === 'skipped').length;
      const total   = run.total ?? results.length;
      const totalMs = hasResults ? results.reduce((s, r) => s + (r.duration || 0), 0) : null;
      const retries = hasResults ? results.filter(r => r.retry > 0).length : null;

      // Compare with previous run of the same suite, if we can find one.
      const sameHistory = history.filter(h => h.suite === run.suite);
      const prev = isLatest ? sameHistory[0] : sameHistory[sameHistory.indexOf(run) + 1];
      const prevPassRate = prev && prev.total ? (prev.passed / prev.total) * 100 : null;
      const thisPassRate = total > 0 ? (passed / total) * 100 : 0;
      const compareBlock = prev ? `
        <div class="info-row"><span class="info-label">vs previous run</span><span class="info-value">
          Pass rate ${prevPassRate != null ? prevPassRate.toFixed(1) : '—'}% → ${thisPassRate.toFixed(1)}% (${deltaLabel(prevPassRate != null ? +((thisPassRate - prevPassRate).toFixed(1)) : 0)})
        </span></div>` : `<div class="info-row"><span class="info-label">vs previous run</span><span class="info-value muted">No earlier run of this suite recorded.</span></div>`;

      const logsNote = `
        <div class="soon-card">
          ${loadingResults ? 'Loading full result log…<br/>' : ''}
          Per-test console output (stdout/stderr) is shown inline below for failed tests, where captured.
          For the full job logs, including warnings, open the run on GitHub Actions.
          ${run.runUrl ? `<div style="margin-top:10px"><a class="btn btn-secondary" href="${run.runUrl}" target="_blank" rel="noopener">View Full Workflow Logs ↗</a></div>` : ''}
        </div>`;

      const allTestRows = hasResults ? results.map((t, i) => {
        const id = `rundetail-${i}`;
        const isFail = t.status === 'failed';
        const console = [t.stdout, t.stderr].flat().filter(Boolean).join('\n');
        return `
        <div class="fail-row">
          <div class="fail-hdr" ${isFail ? `onclick="toggleFail('${id}')" style="cursor:pointer"` : 'style="cursor:default"'}>
            <span class="badge badge-${isFail ? 'fail' : t.status}">${isFail ? 'FAIL' : t.status.toUpperCase()}</span>
            <span class="fail-name" title="${esc(t.name)}">${esc(shortTestLabel(t.name || t.title))}</span>
            <span class="muted" style="margin-left:auto">${t.duration ? (t.duration/1000).toFixed(1)+'s' : '—'}</span>
            ${isFail ? `<span class="fail-chev" id="chev-${id}">▼</span>` : ''}
          </div>
          ${isFail ? `
          <div class="fail-body" id="fail-body-${id}">${esc(t.errorMessage || 'No error message captured.')}</div>
          <div class="fail-extra" id="fail-extra-${id}">
            ${infoRow('Duration', t.duration ? (t.duration/1000).toFixed(1)+'s' : '—')}
            ${console ? `<div class="info-row"><span class="info-label">Console</span><span class="info-value" style="font-family:monospace;font-size:11px;white-space:pre-wrap">${esc(console)}</span></div>` : infoRow('Console', 'Nothing captured for this test')}
          </div>` : ''}
        </div>`;
      }).join('') : '';

      return `
        <div class="page">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Run ${esc(run.runId || (isLatest ? 'latest' : param))}</h1>
              <p class="page-subtitle">${esc(run.suite || 'Unknown suite')} · ${esc(run.environment || '—')}</p>
            </div>
            ${run.runUrl ? `<a class="btn btn-secondary" href="${run.runUrl}" target="_blank" rel="noopener">Open on GitHub ↗</a>` : ''}
          </div>

          ${contextBar(run, { full: true })}

          <div class="grid-2">
            <section class="section card">
              <div class="card-title">Overview</div>
              <div class="info-grid">
                ${infoRow('Status', failed > 0 ? `${failed} failed` : 'All passed')}
                ${infoRow('Passed', passed)}
                ${infoRow('Failed', failed)}
                ${infoRow('Skipped', skipped)}
                ${infoRow('Total', total)}
                ${infoRow('Retries', retries != null ? retries : 'Not tracked for past runs')}
                ${infoRow('Duration', totalMs != null ? formatDuration(totalMs) : 'Not recorded in run history')}
              </div>
            </section>
            <section class="section card">
              <div class="card-title">Execution Metadata</div>
              <div class="info-grid">
                ${infoRow('Triggered By', run.triggeredBy)}
                ${infoRow('Environment', run.environment)}
                ${infoRow('Browser', run.browser)}
                ${infoRow('Device', run.device)}
                ${infoRow('Locale', run.locale)}
                ${infoRow('Timestamp', run.timestamp ? new Date(run.timestamp).toLocaleString() : null)}
              </div>
            </section>
          </div>

          <section class="section card">
            <div class="card-title">Compare with Previous Run</div>
            <div class="info-grid">${compareBlock}</div>
          </section>

          ${hasResults && allTestRows ? `
          <section class="section card">
            <div class="card-title">All Tests <span class="count-badge">${results.length}</span> <span class="card-meta">click a failed row for console output</span></div>
            ${allTestRows}
          </section>` : ''}

          <section class="section">
            <div class="card-title" style="margin-bottom:10px">Logs</div>
            ${logsNote}
          </section>
        </div>
      `;
    }

    function deltaLabel(d) {
      if (!d) return 'no change';
      return d > 0 ? `▲ +${d}` : `▼ ${d}`;
    }

    // ── Failures Page ───────────────────────────────────────────────────────
    function renderFailures() {
      const failures = (latestRun?.results || []).filter(r => r.status === 'failed');

      const header = `
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Failures</h1>
            <p class="page-subtitle">Grouped by module, scoped to the last completed run${latestRun?.suite ? ` (${esc(latestRun.suite)})` : ''}.</p>
          </div>
          ${runSuitesBtn()}
        </div>
      `;

      if (failures.length === 0) {
        return `<div class="page">${header}<div class="page-state" style="color:#16a34a">&#10003; No failures in the latest run.</div></div>`;
      }

      const groups = {};
      failures.forEach(t => {
        const key = (t.name || t.title || '').match(/^([a-z]+(?:-[a-z]+)?)-/)?.[1] || 'other';
        (groups[key] = groups[key] || []).push(t);
      });

      const bookmarks = getBookmarks();
      const knownIssues = getKnownIssues();

      const groupHtml = Object.entries(groups).map(([mod, tests]) => `
        <div class="fail-group-hdr">${esc(mod)} <span class="count-badge">${tests.length}</span></div>
        ${tests.map((t, i) => {
          const id = `${mod}-${i}`;
          const isBookmarked = bookmarks.includes(t.name);
          const isKnown = knownIssues.includes(t.name);
          return `
          <div class="fail-row">
            <div class="fail-hdr" onclick="toggleFail('${id}')">
              <span class="badge badge-fail">FAIL</span>
              <span class="fail-name" title="${esc(t.name)}">${esc(shortTestLabel(t.name || t.title))}</span>
              ${t.retry > 0 ? `<span class="badge badge-flaky">retried ${t.retry}x</span>` : ''}
              ${isKnown ? `<span class="badge" style="background:#e0e7ff;color:#4338ca">known issue</span>` : ''}
              <span class="tag-pill" onclick="event.stopPropagation(); toggleBookmark('${esc(t.name)}', this)" title="Bookmark this failure">${isBookmarked ? '★' : '☆'}</span>
              <span class="fail-chev" id="chev-${id}">▼</span>
            </div>
            <div class="fail-body" id="fail-body-${id}">${esc(t.errorMessage || 'No error message captured.')}</div>
            <div class="fail-extra" id="fail-extra-${id}">
              ${infoRow('Duration', t.duration ? (t.duration / 1000).toFixed(1) + 's' : '—')}
              ${infoRow('Retries', t.retry ?? 0)}
              ${infoRow('Error type', classifyError(t.errorMessage))}
              ${infoRow('Environment', latestRun.environment)}
              ${infoRow('Browser', latestRun.browser)}
              ${infoRow('First/Last seen', 'Not tracked — requires per-test history across runs')}
              ${infoRow('Owner', 'Not assigned')}
              <div class="info-row"><span class="info-label">Known issue</span><span class="info-value">
                <span class="tag-pill" onclick="toggleKnownIssue('${esc(t.name)}', this)">${isKnown ? 'Marked as known ✓' : 'Mark as known issue'}</span>
              </span></div>
              ${(() => { const c = [t.stdout, t.stderr].flat().filter(Boolean).join('\n'); return c
                ? `<div class="info-row"><span class="info-label">Console</span><span class="info-value" style="font-family:monospace;font-size:11px;white-space:pre-wrap">${esc(c)}</span></div>`
                : infoRow('Console', 'Nothing captured for this test'); })()}
              ${latestRun.runUrl ? `<div class="info-row"><span class="info-label">Full logs</span><span class="info-value"><a href="${latestRun.runUrl}" target="_blank" class="link">View workflow logs on GitHub</a></span></div>` : ''}
            </div>
          </div>`;
        }).join('')}
      `).join('');

      return `<div class="page">${header}<section class="section card">${groupHtml}</section></div>`;
    }

    window.toggleFail = function(id) {
      document.getElementById(`fail-body-${id}`)?.classList.toggle('open');
      document.getElementById(`fail-extra-${id}`)?.classList.toggle('open');
      document.getElementById(`chev-${id}`)?.classList.toggle('open');
    };

    function classifyError(msg) {
      if (!msg) return 'Unknown';
      const m = msg.toLowerCase();
      if (m.includes('timeout')) return 'Timeout';
      if (m.includes('not visible') || m.includes('not found')) return 'Element not found/visible';
      if (m.includes('tohavetext') || m.includes('tobe') || m.includes('expected')) return 'Assertion mismatch';
      if (m.includes('network') || m.includes('net::')) return 'Network error';
      return 'Other';
    }

    // ── Bookmarks (localStorage) ────────────────────────────────────────────
    function getBookmarks() { try { return JSON.parse(localStorage.getItem('qa-bookmarks') || '[]'); } catch (_) { return []; } }
    function getRunBookmarks() { try { return JSON.parse(localStorage.getItem('qa-bookmarks-runs') || '[]'); } catch (_) { return []; } }
    function getKnownIssues() { try { return JSON.parse(localStorage.getItem('qa-known-issues') || '[]'); } catch (_) { return []; } }

    window.toggleBookmark = function(name, el) {
      let list = getBookmarks();
      list = list.includes(name) ? list.filter(n => n !== name) : [...list, name];
      localStorage.setItem('qa-bookmarks', JSON.stringify(list));
      if (el) el.textContent = list.includes(name) ? '★' : '☆';
    };
    window.toggleRunBookmark = function(runKey, el) {
      let list = getRunBookmarks();
      list = list.includes(runKey) ? list.filter(n => n !== runKey) : [...list, runKey];
      localStorage.setItem('qa-bookmarks-runs', JSON.stringify(list));
      if (el) el.textContent = list.includes(runKey) ? '★' : '☆';
    };
    window.toggleKnownIssue = function(name, el) {
      let list = getKnownIssues();
      list = list.includes(name) ? list.filter(n => n !== name) : [...list, name];
      localStorage.setItem('qa-known-issues', JSON.stringify(list));
      if (el) el.textContent = list.includes(name) ? 'Marked as known ✓' : 'Mark as known issue';
    };

    // ── Bookmarks Page ───────────────────────────────────────────────────────
    function renderBookmarks() {
      const failNames = getBookmarks();
      const runKeys   = getRunBookmarks();
      const allFails  = (latestRun?.results || []).filter(r => failNames.includes(r.name));
      const allRuns   = history.map((r, i) => ({ ...r, _idx: i })).filter(r => runKeys.includes(r.runId || String(r._idx)));

      return `
        <div class="page">
          <h1 class="page-title">Bookmarks</h1>
          <p class="page-subtitle">Saved runs and failures for quick access. Stored locally in this browser.</p>

          <section class="section card">
            <div class="card-title">Bookmarked Runs <span class="count-badge">${allRuns.length}</span></div>
            ${allRuns.length === 0 ? `<div class="empty-note">No bookmarked runs yet — star a run on the Runs page.</div>` : allRuns.map(r => `
              <div class="mini-run-row">
                <span class="status-pill ${r.failed > 0 ? 'status-fail' : 'status-pass'}">${r.failed > 0 ? 'Failed' : 'Passed'}</span>
                <span class="mini-run-suite">${esc(r.suite)}</span>
                <span class="mini-run-meta">${esc(r.environment)} · ${r.timestamp ? new Date(r.timestamp).toLocaleString() : '—'}</span>
                <a href="#run/${r._idx}" class="link">Open →</a>
              </div>`).join('')}
          </section>

          <section class="section card">
            <div class="card-title">Bookmarked Failures <span class="count-badge">${allFails.length}</span></div>
            ${allFails.length === 0 ? `<div class="empty-note">No bookmarked failures yet — star a failure on the Failures page.</div>` : `
              <table class="data-table"><thead><tr><th>Test</th><th>Error</th></tr></thead><tbody>
                ${allFails.map(t => `<tr><td class="test-name" title="${esc(t.name)}">${esc(shortTestLabel(t.name))}</td><td class="error-msg">${esc(t.errorMessage || '—')}</td></tr>`).join('')}
              </tbody></table>`}
          </section>

          <section class="section soon-card">
            <b>Saved Filters</b> (Nightly / Smoke / Regression / Production) are <b>coming shortly</b> — they need suite tagging standardized first, so presets stay reliable instead of guessing at matches.
          </section>
        </div>
      `;
    }

    // ── Tests Page ──────────────────────────────────────────────────────────────
    function renderTests() {
      const allResults = [];
      if (latestRun?.results) allResults.push(...latestRun.results);
      history.forEach(run => { if (run.results) allResults.push(...run.results); });

      if (allResults.length === 0) {
        return `<div class="page">
          <h1 class="page-title">Tests</h1>
          <div class="page-state">No test data yet. Run a suite locally or via GitHub Actions first.</div>
        </div>`;
      }

      const seen = new Map();
      allResults.forEach(r => { if (!seen.has(r.name)) seen.set(r.name, r); });
      const tests = [...seen.values()];

      const locales = [...new Set(tests.flatMap(t => (t.tags || []).filter(tag =>
        ['us','gb','de','fr','jp','au','ca','mx','br','in','es','it','kr','nl','se'].includes(tag)
      )))].sort();

      const suites = [...new Set(tests.map(t => {
        const m = (t.name || '').match(/^([a-z]+(?:-[a-z]+)?)-/);
        return m ? m[1] : null;
      }).filter(Boolean))].sort();

      return `
        <div class="page">
          <h1 class="page-title">Tests <span class="count-badge">${tests.length}</span></h1>
          <p class="page-subtitle">Every test seen across the latest run and recorded history.</p>

          <div class="filter-bar">
            <input id="test-search" type="text" placeholder="Search by name or tag…" />
            <select id="filter-locale"><option value="">All locales</option>${locales.map(l => `<option value="${l}">${l.toUpperCase()}</option>`).join('')}</select>
            <select id="filter-suite"><option value="">All suites</option>${suites.map(s => `<option value="${s}">${s}</option>`).join('')}</select>
            <select id="filter-status">
              <option value="">All statuses</option>
              <option value="passed">Passed</option>
              <option value="failed">Failed</option>
              <option value="skipped">Skipped</option>
            </select>
          </div>

          <section class="section card">
            <table class="data-table" id="tests-table">
              <thead><tr><th>Grep Tag</th><th>Test Name</th><th>Locale</th><th>Status</th><th>Duration</th></tr></thead>
              <tbody>
                ${tests.map(t => {
                  const grepTag = '@' + (t.name || '').split('|')[0].trim();
                  const locale  = (t.tags || []).find(tag => ['us','gb','de','fr','jp','au','ca','mx','br','in','es','it','kr','nl','se'].includes(tag)) || '—';
                  const suite   = (t.name || '').match(/^([a-z]+(?:-[a-z]+)?)-/)?.[1] || '—';
                  const status  = t.status || '—';
                  const color   = status === 'passed' ? '#16a34a' : status === 'failed' ? '#dc2626' : '#9ca3af';
                  return `
                    <tr data-name="${esc(t.name)}" data-locale="${locale}" data-suite="${suite}" data-status="${status}">
                      <td><span class="tag-pill" onclick="copyTag(this, '${esc(grepTag)}')" title="Click to copy grep tag">${esc(grepTag)}<span class="copy-icon">⎘</span></span></td>
                      <td class="test-name">${esc(t.name || t.title)}</td>
                      <td>${locale.toUpperCase()}</td>
                      <td style="color:${color};font-weight:500">${status}</td>
                      <td>${t.duration ? (t.duration / 1000).toFixed(1) + 's' : '—'}</td>
                    </tr>`;
                }).join('')}
              </tbody>
            </table>
          </section>
        </div>`;
    }

    function wireTests() {
      function filterTable() {
        const search = document.getElementById('test-search')?.value.toLowerCase() || '';
        const locale = document.getElementById('filter-locale')?.value || '';
        const suite  = document.getElementById('filter-suite')?.value || '';
        const status = document.getElementById('filter-status')?.value || '';
        document.querySelectorAll('#tests-table tbody tr').forEach(row => {
          const name = row.dataset.name?.toLowerCase() || '';
          row.style.display = (!search || name.includes(search)) && (!locale || row.dataset.locale === locale)
            && (!suite || row.dataset.suite === suite) && (!status || row.dataset.status === status) ? '' : 'none';
        });
      }
      ['test-search','filter-locale','filter-suite','filter-status'].forEach(id => document.getElementById(id)?.addEventListener('input', filterTable));
      applyPendingSearch('test-search', filterTable);
    }

    function copyTag(el, tag) {
      navigator.clipboard.writeText(tag).then(() => {
        el.classList.add('copied');
        el.childNodes[0].nodeValue = 'Copied! ';
        setTimeout(() => { el.classList.remove('copied'); el.childNodes[0].nodeValue = tag + ' '; }, 1500);
      });
    }

    // ── Analytics Page ──────────────────────────────────────────────────────────
    function renderAnalytics() {
      const suites   = [...new Set(history.map(h => h.suite).filter(Boolean))].sort();
      const envs     = [...new Set(history.map(h => h.environment).filter(Boolean))].sort();
      const browsers = [...new Set(history.map(h => h.browser).filter(Boolean))].sort();
      const locales  = [...new Set(history.map(h => h.locale).filter(Boolean))].sort();
      const defaultSuite = latestRun?.suite || suites[0] || '';

      const results  = (latestRun && latestRun.results) || [];
      const failures = results.filter(r => r.status === 'failed');
      const flakyTests = results.filter(r => r.retry > 0).sort((a, b) => b.retry - a.retry);
      const slowTests = [...results].filter(r => r.duration > 0).sort((a, b) => b.duration - a.duration).slice(0, 10);

      // Failure cards grouped by module (mirrors Failures page grouping)
      const groups = {};
      failures.forEach(t => {
        const key = (t.name || '').match(/^([a-z]+(?:-[a-z]+)?)-/)?.[1] || 'other';
        (groups[key] = groups[key] || []).push(t);
      });
      const failureCards = Object.entries(groups).length ? Object.entries(groups).map(([mod, tests]) => {
        const totalSec = (tests.reduce((s, t) => s + (t.duration || 0), 0) / 1000).toFixed(0);
        const last = tests[tests.length - 1];
        return `
          <div class="fail-card">
            <div class="fail-card-title">${esc(mod)}</div>
            <div class="fail-card-meta">${tests.length} failure${tests.length !== 1 ? 's' : ''} · ${totalSec}s total</div>
            <div class="fail-card-foot">
              <span class="muted">Last: ${esc(last.name.split('|')[0] || last.name)}</span>
              <a href="#failures" class="link">Open →</a>
            </div>
          </div>`;
      }).join('') : `<div class="empty-note">No failures in the latest run.</div>`;

      const slowCards = slowTests.length ? slowTests.map(t => `
        <div class="slow-card">
          <div class="fail-card-title" style="font-family:monospace;font-size:11.5px" title="${esc(t.name)}">${esc(shortTestLabel(t.name))}</div>
          <div class="fail-card-foot">
            <span style="font-weight:700;color:${t.duration > 15000 ? '#dc2626' : t.duration > 8000 ? '#d97706' : '#374151'}">${(t.duration/1000).toFixed(1)}s</span>
            <span class="muted" title="Trend requires per-test history across runs, not yet tracked">trend: —</span>
            <span class="badge badge-${t.status}">${t.status}</span>
          </div>
        </div>`).join('') : `<div class="empty-note">No timing data yet.</div>`;

      return `
      <div class="page">
        <div class="page-header-row">
          <div>
            <h1 class="page-title">Analytics</h1>
            <p class="page-subtitle">Trends and quality signals, scoped to the suite/context you select below. Unrelated suites are never combined into one trend.</p>
          </div>
        </div>

        <div class="filter-bar">
          <label>Suite</label>
          <select id="an-suite"><option value="">All</option>${suites.map(s => `<option value="${esc(s)}" ${s === defaultSuite ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          <label>Env</label>
          <select id="an-env"><option value="">All</option>${envs.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('')}</select>
          <label>Browser</label>
          <select id="an-browser"><option value="">All</option>${browsers.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select>
          <label>Locale</label>
          <select id="an-locale"><option value="">All</option>${locales.map(l => `<option value="${esc(l)}">${esc(l)}</option>`).join('')}</select>
        </div>

        <div id="sampleWarning"></div>

        <div class="grid-2 section">
          <div class="card">
            <div class="card-header"><span class="card-title">Test Status Breakdown</span><span class="card-meta">last completed run</span></div>
            <div class="chart-container" id="statusPieChart" style="height:220px;"></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Runs by Environment</span><span class="card-meta">all recorded runs</span></div>
            <div class="chart-container" id="envPieChart" style="height:220px;"></div>
          </div>
        </div>

        <div class="grid-2 section">
          <div class="card"><div class="card-header"><span class="card-title">Pass Trend</span><span class="card-meta" id="trendMeta"></span></div>
            <div class="chart-container" id="passChart" style="height:220px;"></div></div>
          <div class="card"><div class="card-header"><span class="card-title">Failure Trend</span></div>
            <div class="chart-container" id="failChart" style="height:220px;"></div></div>
        </div>

        <div class="grid-2 section">
          <div class="card"><div class="card-header"><span class="card-title">Total Tests Executed Trend</span><span class="card-meta">suite size over time</span></div>
            <div class="chart-container" id="totalChart" style="height:220px;"></div></div>
          <div class="card"><div class="card-header"><span class="card-title">Execution Duration Trend</span></div>
            <div class="chart-container" id="durationChart" style="height:220px;"></div></div>
        </div>

        <div class="grid-2 section">
          <div class="card">
            <div class="card-header"><span class="card-title">Top Failures</span><span class="count-badge">${failures.length}</span></div>
            <div class="card-grid">${failureCards}</div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Slow Tests</span><span class="card-meta">latest run</span></div>
            <div class="card-grid">${slowCards}</div>
          </div>
        </div>

        <div class="section" id="suiteLocaleSection"></div>

        ${flakyTests.length > 0 ? `
        <div class="section card">
          <div class="card-header"><span class="card-title">Flaky Leaderboard</span><span class="count-badge">${flakyTests.length}</span></div>
          <table class="results-table">
            <thead><tr><th>Test</th><th style="text-align:center;">Retries</th><th>Final Status</th><th>Instability</th></tr></thead>
            <tbody>${flakyTests.slice(0, 15).map(r => `
              <tr>
                <td style="font-family:monospace;font-size:12px;" title="${esc(r.name)}">${esc(shortTestLabel(r.name))}</td>
                <td style="text-align:center;color:#d97706;font-weight:700;">${r.retry}</td>
                <td><span class="badge badge-${r.status}">${r.status}</span></td>
                <td><div style="display:flex;align-items:center;gap:6px;"><div class="flaky-bar-bg"><div class="flaky-bar-fill" style="width:${Math.min(100, r.retry * 33)}%"></div></div><span style="font-size:11px;color:#6b7280;">${r.retry}x</span></div></td>
              </tr>`).join('')}</tbody>
          </table>
        </div>` : ''}
      </div>`;
    }

    function wireAnalytics() {
      const filterIds = ['an-suite', 'an-env', 'an-browser', 'an-locale'];
      function currentFilters() {
        return {
          suite: document.getElementById('an-suite')?.value || '',
          env: document.getElementById('an-env')?.value || '',
          browser: document.getElementById('an-browser')?.value || '',
          locale: document.getElementById('an-locale')?.value || '',
        };
      }
      function filteredHistory() {
        const f = currentFilters();
        return history.filter(h =>
          (!f.suite || h.suite === f.suite) && (!f.env || h.environment === f.env) &&
          (!f.browser || h.browser === f.browser) && (!f.locale || h.locale === f.locale));
      }

      function lineChart(el, ordered, key, color, extra = {}) {
        if (!el) return;
        if (ordered.length === 0) {
          el.innerHTML = `<div class="empty-note" style="height:220px;display:flex;align-items:center;justify-content:center;">No runs match this filter yet.</div>`;
          return;
        }
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        const dates = ordered.map(h => new Date(h.timestamp).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
        chart.setOption({
          tooltip: { trigger: 'axis', formatter: (p) => {
            const h = ordered[p[0].dataIndex];
            return `${h.suite || ''} — ${p[0].name}<br/>Pass: ${h.passed ?? 0} · Fail: ${h.failed ?? 0}`;
          }},
          grid: { left: 40, right: 16, top: 12, bottom: 36 },
          xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10, rotate: 30 } },
          yAxis: { type: 'value', min: extra.min, max: extra.max, minInterval: extra.minInterval, axisLabel: { fontSize: 10 } },
          series: [{ type: 'line', data: ordered.map(key), smooth: true, areaStyle: { opacity: 0.15 }, lineStyle: { width: 2, color }, itemStyle: { color }, symbol: 'circle', symbolSize: 5 }],
        });
      }

      function drawPie(el, entries, colors) {
        if (!el) return;
        if (entries.length === 0) {
          el.innerHTML = `<div class="empty-note" style="height:220px;display:flex;align-items:center;justify-content:center;">No data yet.</div>`;
          return;
        }
        if (entries.length === 1) {
          el.innerHTML = `<div class="empty-note" style="height:220px;display:flex;align-items:center;justify-content:center;">Only one value recorded so far (${esc(entries[0][0])}) — nothing to break down until more variety shows up.</div>`;
          return;
        }
        const chart = echarts.getInstanceByDom(el) || echarts.init(el);
        chart.setOption({
          tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
          legend: { bottom: 0, textStyle: { fontSize: 11 } },
          series: [{
            type: 'pie', radius: ['42%', '68%'],
            data: entries.map(([name, value]) => ({ name, value, itemStyle: colors && colors[name] ? { color: colors[name] } : undefined })),
            label: { fontSize: 11 },
          }],
        });
      }

      function draw() {
        if (typeof echarts === 'undefined') return;
        const filtered = filteredHistory();
        const ordered = [...filtered].reverse();
        const trendMetaEl = document.getElementById('trendMeta');
        if (trendMetaEl) trendMetaEl.textContent = `${filtered.length} run${filtered.length !== 1 ? 's' : ''}`;

        const warnEl = document.getElementById('sampleWarning');
        if (warnEl) {
          warnEl.innerHTML = filtered.length > 0 && filtered.length < 3
            ? `<div class="soon-card section" style="border-color:#fbbf24;background:#fffbeb;color:#92400e">
                 ⚠ Only <b>${filtered.length}</b> run${filtered.length !== 1 ? 's' : ''} recorded for this filter — trend lines below are directional at best, not statistically meaningful yet. They'll firm up as more runs accumulate.
               </div>`
            : '';
        }

        // Status breakdown — real composition of the latest run, reliable
        // regardless of how few historical runs exist.
        const latestResults = (latestRun && latestRun.results) || [];
        const statusEntries = [
          ['Passed', latestResults.filter(r => r.status === 'passed').length],
          ['Failed', latestResults.filter(r => r.status === 'failed').length],
          ['Skipped', latestResults.filter(r => r.status === 'skipped').length],
        ].filter(([, v]) => v > 0);
        drawPie(document.getElementById('statusPieChart'), statusEntries, { Passed: '#16a34a', Failed: '#dc2626', Skipped: '#9ca3af' });

        // Runs by environment — counts every recorded run, not a trend, so
        // it stays accurate even with very little history.
        const envCounts = {};
        history.forEach(h => { if (h.environment) envCounts[h.environment] = (envCounts[h.environment] || 0) + 1; });
        drawPie(document.getElementById('envPieChart'), Object.entries(envCounts));

        lineChart(document.getElementById('passChart'), ordered, h => h.passed || 0, '#16a34a', { minInterval: 1 });
        lineChart(document.getElementById('failChart'), ordered, h => h.failed || 0, '#dc2626', { minInterval: 1 });
        lineChart(document.getElementById('totalChart'), ordered, h => h.total || 0, '#6366f1', { minInterval: 1 });

        // Duration isn't recorded in run-history.json — be honest instead of faking a trend.
        const durationEl = document.getElementById('durationChart');
        if (durationEl) {
          durationEl.innerHTML = `<div class="empty-note" style="height:220px;display:flex;align-items:center;justify-content:center;">Duration isn't recorded in run history yet — only the latest run's total (${formatDuration((latestRun?.results||[]).reduce((s,r)=>s+(r.duration||0),0))}) is available.</div>`;
        }

        // Suite / Locale breakdown — only shown when the current filter spans more than one.
        const section = document.getElementById('suiteLocaleSection');
        if (section) {
          const suitesInView  = [...new Set(filtered.map(h => h.suite).filter(Boolean))];
          const localesInView = [...new Set(filtered.map(h => h.locale).filter(Boolean))];
          let html = '';
          if (suitesInView.length > 1) {
            const counts = {};
            filtered.forEach(h => { counts[h.suite] = (counts[h.suite] || 0) + 1; });
            html += `<div class="card" style="margin-bottom:20px"><div class="card-title">Suite Distribution</div>
              <div class="chart-container" id="suiteDistChart" style="height:200px;"></div></div>`;
            setTimeout(() => {
              const el = document.getElementById('suiteDistChart');
              if (el) echarts.init(el).setOption({
                tooltip: { trigger: 'item' },
                series: [{ type: 'pie', radius: ['42%','68%'], data: Object.entries(counts).map(([name, value]) => ({ name, value })), label: { fontSize: 11 } }],
              });
            }, 0);
          }
          if (localesInView.length > 1) {
            const counts = {};
            filtered.forEach(h => { counts[h.locale] = (counts[h.locale] || 0) + 1; });
            html += `<div class="card"><div class="card-title">Locale Breakdown</div>
              <div class="chart-container" id="localeDistChart" style="height:200px;"></div></div>`;
            setTimeout(() => {
              const el = document.getElementById('localeDistChart');
              if (el) echarts.init(el).setOption({
                tooltip: { trigger: 'item' },
                xAxis: { type: 'category', data: Object.keys(counts), axisLabel: { fontSize: 10 } },
                yAxis: { type: 'value', minInterval: 1 },
                series: [{ type: 'bar', data: Object.values(counts), itemStyle: { color: '#9333ea', borderRadius: [4,4,0,0] } }],
              });
            }, 0);
          }
          section.innerHTML = html;
        }

        window.__analyticsCharts = ['statusPieChart','envPieChart','passChart','failChart','totalChart']
          .map(id => document.getElementById(id)).filter(Boolean)
          .map(el => echarts.getInstanceByDom(el)).filter(Boolean);
      }

      filterIds.forEach(id => document.getElementById(id)?.addEventListener('change', draw));
      draw();
    }

    // ── Compare Runs Page ────────────────────────────────────────────────────
    function renderCompare() {
      const options = history.map((r, i) => `<option value="${i}">#${esc(r.runId || i)} — ${esc(r.suite)} — ${r.timestamp ? new Date(r.timestamp).toLocaleDateString() : ''}</option>`).join('');
      return `
        <div class="page">
          <h1 class="page-title">Compare Runs</h1>
          <p class="page-subtitle">Compare summary metrics between two recorded runs.</p>
          <div class="filter-bar">
            <label>Run A</label>
            <select id="cmp-a"><option value="">Select…</option>${options}</select>
            <label>Run B</label>
            <select id="cmp-b"><option value="">Select…</option>${options}</select>
          </div>
          <section class="section card" id="cmp-result">
            <div class="empty-note">Choose two runs above to compare.</div>
          </section>
        </div>
      `;
    }

    function wireCompare() {
      function draw() {
        const a = history[Number(document.getElementById('cmp-a')?.value)];
        const b = history[Number(document.getElementById('cmp-b')?.value)];
        const el = document.getElementById('cmp-result');
        if (!el) return;
        if (!a || !b) { el.innerHTML = `<div class="empty-note">Choose two runs above to compare.</div>`; return; }

        const passRate = r => r.total ? ((r.passed / r.total) * 100).toFixed(1) : '0';
        const rows = [
          ['Suite', a.suite, b.suite],
          ['Environment', a.environment, b.environment],
          ['Pass Rate', passRate(a) + '%', passRate(b) + '%'],
          ['Passed', a.passed ?? '—', b.passed ?? '—'],
          ['Failed', a.failed ?? '—', b.failed ?? '—'],
          ['Timestamp', a.timestamp ? new Date(a.timestamp).toLocaleString() : '—', b.timestamp ? new Date(b.timestamp).toLocaleString() : '—'],
        ];
        el.innerHTML = `
          <table class="data-table">
            <thead><tr><th>Metric</th><th>Run A</th><th>Run B</th></tr></thead>
            <tbody>${rows.map(([label, av, bv]) => `<tr><td>${esc(label)}</td><td>${esc(String(av))}</td><td>${esc(String(bv))}</td></tr>`).join('')}</tbody>
          </table>
          <div class="soon-card" style="margin-top:16px">
            Per-test diff (new failures / resolved failures) requires storing full per-test results for every past run.
            This data model only retains that for the latest run, so test-level diffing across two arbitrary past runs
            isn't available yet — summary comparison above is accurate and derived from real data.
          </div>
        `;
      }
      document.getElementById('cmp-a')?.addEventListener('change', draw);
      document.getElementById('cmp-b')?.addEventListener('change', draw);

      // Support #compare?a=<index> deep link from the Runs page
      const q = new URLSearchParams(window.location.hash.split('?')[1] || '');
      if (q.get('a')) { const sel = document.getElementById('cmp-a'); if (sel) { sel.value = q.get('a'); draw(); } }
    }

    // ── Logs Explorer Page ───────────────────────────────────────────────────
    function renderArtifacts() {
      if (!latestRun) return `<div class="page"><h1 class="page-title">Logs</h1><div class="page-state">No run data yet.</div></div>`;
      const results = latestRun.results || [];
      const withConsole = results.filter(r => (r.stdout && r.stdout.length) || (r.stderr && r.stderr.length));
      const recentWithLogs = history.slice(0, 8);

      return `
        <div class="page">
          <h1 class="page-title">Logs</h1>
          <p class="page-subtitle">Console output and workflow logs for the last completed run (${esc(latestRun.suite || '')}).</p>
          <section class="section card">
            <div class="card-header"><span class="card-title">Console Output Captured</span><span class="count-badge">${withConsole.length}</span></div>
            ${withConsole.length === 0 ? `<div class="empty-note">No test in this run captured stdout/stderr.</div>` : `
              <table class="data-table">
                <thead><tr><th>Test</th><th>Status</th><th>Console</th></tr></thead>
                <tbody>${withConsole.map(r => `
                  <tr><td class="test-name" title="${esc(r.name)}">${esc(shortTestLabel(r.name))}</td><td><span class="badge badge-${r.status}">${esc(r.status)}</span></td>
                  <td><a href="#run/latest" class="link">View →</a></td></tr>`).join('')}</tbody>
              </table>`}
          </section>
          <section class="section card">
            <div class="card-header"><span class="card-title">Full Workflow Logs by Run</span></div>
            ${recentWithLogs.map(r => `
              <div class="mini-run-row">
                <span class="mini-run-suite">${esc(r.suite || 'unknown')}</span>
                <span class="mini-run-meta">${r.timestamp ? new Date(r.timestamp).toLocaleString() : '—'}</span>
                ${r.runUrl ? `<a href="${r.runUrl}" target="_blank" class="link">Open Logs ↗</a>` : '<span class="muted">No link recorded</span>'}
              </div>`).join('')}
          </section>
        </div>
      `;
    }

    // ── Schedules Page (Coming Soon, but shows the real cron) ───────────────
    function renderSchedules() {
      const suitesAvail = [...new Set([latestRun && latestRun.suite, ...history.map(h => h.suite)].filter(Boolean))];
      return `
        <div class="page">
          <h1 class="page-title">Schedules</h1>
          <p class="page-subtitle">Automated executions configured in the GitHub Actions workflow.</p>

          <section class="section card">
            <div class="card-title">Current Schedule</div>
            <div class="info-grid">
              ${infoRow('Runs', KNOWN_CRON.label)}
              ${infoRow('Defined in', '.github/workflows/run-tests.yml')}
            </div>
            <div class="muted" style="font-size:11px;margin-top:8px">Cron expression: <code>${KNOWN_CRON.expr}</code> (minute hour day month weekday, in UTC)</div>
          </section>

          <section class="section card">
