            <div class="card-title">Build a Schedule</div>
            <p style="font-size:12.5px;color:#6b7280;margin:-8px 0 16px">
              Pick a time below to get the exact cron line to paste into the workflow.
            </p>
            <div class="filter-bar">
              <label>Frequency</label>
              <select id="sch-freq">
                <option value="daily">Every day</option>
                <option value="weekdays" selected>Weekdays (Mon–Fri)</option>
                <option value="weekly">Once a week</option>
              </select>
              <label>Day</label>
              <select id="sch-day" disabled>
                <option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option>
                <option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option>
                <option value="0">Sunday</option>
              </select>
              <label>Time (IST)</label>
              <select id="sch-hour">${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${h === 9 ? 'selected' : ''}>${String(h).padStart(2, '0')}:00</option>`).join('')}</select>
              <label>Suite (for reference)</label>
              <select id="sch-suite">${suitesAvail.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
              <label>Env</label>
              <select id="sch-env"><option value="prod">prod</option><option value="stage">stage</option><option value="aem-live">aem-live</option></select>
            </div>
            <div id="sch-preview"></div>
          </section>
        </div>
      `;
    }

    function wireSchedules() {
      function draw() {
        const freq = document.getElementById('sch-freq')?.value || 'weekdays';
        const dayEl = document.getElementById('sch-day');
        const hour  = Number(document.getElementById('sch-hour')?.value ?? 9);
        const suite = document.getElementById('sch-suite')?.value || '';
        const env   = document.getElementById('sch-env')?.value || 'prod';
        if (dayEl) dayEl.disabled = freq !== 'weekly';

        const dayLabelMap = { 0: 'Sunday', 1: 'Monday', 2: 'Tuesday', 3: 'Wednesday', 4: 'Thursday', 5: 'Friday', 6: 'Saturday' };
        const weekdayField = freq === 'daily' ? '*' : freq === 'weekly' ? (dayEl?.value ?? '1') : '1-5';
        const freqLabel = freq === 'daily' ? 'Every day' : freq === 'weekly' ? dayLabelMap[dayEl?.value ?? '1'] + 's' : 'Weekdays (Mon–Fri)';

        // IST (UTC+5:30) -> UTC, since GitHub Actions cron always runs in UTC.
        let totalMinUtc = hour * 60 - 330;
        if (totalMinUtc < 0) totalMinUtc += 1440;
        const hourUtc = Math.floor(totalMinUtc / 60) % 24;
        const minUtc  = totalMinUtc % 60;
        const cronExpr = `${minUtc} ${hourUtc} * * ${weekdayField}`;

        const el = document.getElementById('sch-preview');
        if (!el) return;
        el.innerHTML = `
          <div class="info-grid" style="margin-bottom:12px">
            ${infoRow('This schedule', `${freqLabel} at ${String(hour).padStart(2,'0')}:00 IST`)}
            ${infoRow('Cron (UTC)', cronExpr)}
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
            <span class="tag-pill" onclick="copyText(this, '  - cron: \\'${cronExpr}\\'')">- cron: '${cronExpr}'<span class="copy-icon">⎘</span></span>
            <span class="muted" style="font-size:11.5px">paste under <code>schedule:</code> in run-tests.yml</span>
          </div>
          <div class="soon-card">
            Available today: the cron timing above. Choosing which suite/environment a schedule targets is <b>available shortly</b>.
          </div>
        `;
      }
      ['sch-freq', 'sch-day', 'sch-hour', 'sch-suite', 'sch-env'].forEach(id => document.getElementById(id)?.addEventListener('change', draw));
      draw();
    }

    window.copyText = function(el, text) {
      navigator.clipboard.writeText(text).then(() => {
        const original = el.innerHTML;
        el.textContent = 'Copied!';
        setTimeout(() => { el.innerHTML = original; }, 1500);
      });
    };

    // ── Global search (sidebar) ──────────────────────────────────────────────
    function wireGlobalSearch() {
      const input = document.getElementById('global-search');
      if (!input) return;
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          sessionStorage.setItem('qa-pending-search', input.value.trim());
          navigate('runs');
        }
      });
    }
    function applyPendingSearch(inputId, cb) {
      const pending = sessionStorage.getItem('qa-pending-search');
      if (pending) {
        sessionStorage.removeItem('qa-pending-search');
        const el = document.getElementById(inputId);
        if (el) { el.value = pending; cb(); }
      }
    }

    // ── Helpers ─────────────────────────────────────────────────────────────
    function kpiCard(label, value, color) {
      const style = color ? `style="color:${color}"` : '';
      return `<div class="kpi-card"><span class="kpi-value" ${style}>${value ?? '—'}</span><span class="kpi-label">${label}</span></div>`;
    }
    function infoRow(label, value) {
      return `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${value != null ? esc(String(value)) : '—'}</span></div>`;
    }
    function firstErrorLine(msg) {
      if (!msg) return 'No error message captured.';
      return String(msg).split('\n')[0].trim();
    }
    function formatDuration(ms) {
      if (!ms || ms <= 0) return '—';
      const totalSec = Math.round(ms / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return m > 0 ? `${m}m ${s}s` : `${s}s`;
    }
    function esc(str) {
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // Test names repeat the suite/locale prefix on every row (e.g.
    // "unav-us-cc-business-teams | United States | cc-business-teams,"),
    // which is redundant once the suite/locale is already shown elsewhere
    // on the page — and forces awkward mid-word truncation. Show just the
    // distinguishing last segment instead; the full name is still in the
    // title attribute wherever this is used.
    function shortTestLabel(name) {
      if (!name) return '';
      const parts = String(name).split('|').map(s => s.trim());
      const last = parts[parts.length - 1] || name;
      return last.replace(/,\s*$/, '') || name;
    }

    // ── Sidebar click handlers ───────────────────────────────────────────────
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => navigate(el.dataset.page));
    });
    wireGlobalSearch();

    // ── Boot ────────────────────────────────────────────────────────────────
    loadData();
  </script>
</body>
</html>
