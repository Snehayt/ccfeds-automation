<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Agentic QE Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; font-size: 13.5px; background: #0b0f19; color: #f1f5f9; }
    a { color: inherit; text-decoration: none; }

    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 230px; background: #0f172a; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
    .sidebar-brand { font-size: 15px; font-weight: 700; padding: 0 20px 18px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .sidebar-brand small { display: block; font-size: 11px; color: #94a3b8; font-weight: 400; margin-top: 3px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: #94a3b8; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.15s; }
    .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.12); color: #60a5fa; }

    .app-main { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .page-title { font-size: 22px; font-weight: 700; color: #fff; }

    /* Top Strip Metrics */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .kpi-card { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
    .kpi-value { font-size: 24px; font-weight: 700; color: #fff; }
    .kpi-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }

    /* 3-Column Layout */
    .workbench-grid { display: grid; grid-template-columns: 310px minmax(0, 1fr) 300px; gap: 20px; align-items: start; }

    /* Column 1: Queue */
    .queue-panel { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .queue-header span { font-size: 12px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .queue-feed { display: flex; flex-direction: column; gap: 8px; max-height: 650px; overflow-y: auto; padding-right: 4px; }
    .queue-card { background: #090e17; border: 1px solid #1e293b; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: 0.15s; }
    .queue-card.selected { background: #1e293b; border-color: #3b82f6; }
    .queue-card:hover { border-color: #60a5fa; }

    /* Column 2: 3-Step Work Card */
    .workflow-card { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
    .step-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .step-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #38bdf8; }
    .step-badge span { background: #0284c7; color: #fff; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }

    .meta-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .pill { padding: 4px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .pill-jira { background: #1d4ed8; color: #fff; }
    .pill-pr { background: #1e293b; border: 1px solid #3b82f6; color: #93c5fd; }
    .pill-suite { background: #312e81; color: #a5b4fc; }

    .ticket-title { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.4; margin-bottom: 12px; }
    .sub-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; margin-bottom: 6px; }
    .files-list { background: #090e17; border: 1px solid #1e293b; border-radius: 6px; padding: 10px 12px; font-family: monospace; font-size: 12px; color: #cbd5e1; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .url-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .url-item { background: #090e17; border: 1px solid #1e293b; border-radius: 6px; padding: 6px 10px; color: #38bdf8; font-size: 12px; text-decoration: none; word-break: break-all; }
    .url-item:hover { border-color: #38bdf8; }
    .checks-list { display: flex; flex-direction: column; gap: 6px; }
    .check-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.02); padding: 8px 10px; border-radius: 6px; border: 1px solid #1e293b; font-size: 12px; cursor: pointer; }
    .check-item input { accent-color: #3b82f6; width: 14px; height: 14px; }

    .execution-container { background: #090e17; border: 1px solid #1e293b; border-radius: 8px; overflow: hidden; }
    .execution-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #1e293b; font-size: 11.5px; font-weight: 600; }
    .terminal-window { height: 160px; padding: 10px 12px; font-family: 'Consolas', monospace; font-size: 11.5px; color: #38bdf8; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
    .signoff-box { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 8px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }

    .btn { border: none; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; transition: 0.15s; }
    .btn-run { background: #10b981; color: #fff; }
    .btn-run:hover { background: #059669; }
    .btn-signoff { background: #059669; color: #fff; }
    .btn-signoff:hover { background: #047857; }
    .btn-fetch { background: #2563eb; color: #fff; }

    /* Column 3: Agent Companion */
    .companion-panel { background: #131c31; border: 1px solid #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 680px; overflow: hidden; }
    .companion-header { padding: 14px 16px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 700; color: #fff; }
    .companion-chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; }
    .chat-msg { max-width: 95%; padding: 8px 10px; border-radius: 8px; line-height: 1.45; word-break: break-word; }
    .chat-msg.agent { background: #0f172a; border: 1px solid #1e293b; color: #e2e8f0; align-self: flex-start; }
    .chat-msg.user { background: #1d4ed8; color: #fff; align-self: flex-end; }
    .companion-input { padding: 10px 12px; border-top: 1px solid #1e293b; display: flex; gap: 6px; background: #090e17; }
    .companion-input input { flex: 1; background: #131c31; border: 1px solid #1e293b; border-radius: 6px; color: #fff; padding: 7px 10px; font-size: 12px; outline: none; }
    .divider { height: 1px; background: #1e293b; width: 100%; margin: 2px 0; }
  </style>
</head>
<body>
  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-brand">
        QE Platform
        <small>Agentic Test Automation</small>
      </div>
      <a class="nav-item active" onclick="switchPage('workbench')">📥 Workbench (Tattva)</a>
      <a class="nav-item" onclick="switchPage('runs')">⚡ Execution Runs</a>
      <a class="nav-item" onclick="switchPage('failures')">🔴 Failure Triage</a>
      <a class="nav-item" onclick="switchPage('analytics')">📊 Quality Analytics</a>
    </nav>

    <main class="app-main" id="main-content">
      <!-- Injected Dynamically -->
    </main>
  </div>

  <script>
    let queueTasks = [];
    let selectedTaskId = null;
    let currentPage = 'workbench';

    function switchPage(page) {
      currentPage = page;
      window.location.hash = page;
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.textContent.toLowerCase().includes(page));
      });
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const main = document.getElementById('main-content');
      if (currentPage === 'workbench') {
        main.innerHTML = getWorkbenchMarkup();
        renderQueueFeed();
        updateMetrics();
        if (selectedTaskId) {
          const current = queueTasks.find(t => t.id === selectedTaskId);
          if (current) renderActiveCard(current);
        } else if (queueTasks.length > 0) {
          selectQueueTask(queueTasks[0].id);
        }
      } else if (currentPage === 'runs') {
        main.innerHTML = `<div class="page-title">Execution Runs</div><p style="color:#94a3b8;margin-top:8px;">Live executions appear in the Workbench card.</p>`;
      } else if (currentPage === 'failures') {
        main.innerHTML = `<div class="page-title">Failure Triage</div><p style="color:#10b981;margin-top:8px;">✓ All triage items up to date.</p>`;
      } else if (currentPage === 'analytics') {
        main.innerHTML = `<div class="page-title">Quality Analytics</div><p style="color:#94a3b8;margin-top:8px;">Suite velocity metrics loaded.</p>`;
      }
    }

    function getWorkbenchMarkup() {
      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">Agentic QE Workbench</h1>
            <p style="color:#94a3b8; font-size:12.5px; margin-top:3px;">In-Situ PR Validation &bull; Team Tattva (adobe/milo)</p>
          </div>
        </div>

        <div class="kpi-grid">
          <div class="kpi-card"><span class="kpi-value" id="metric-in-test" style="color: #60a5fa;">0</span><span class="kpi-label">Tickets In-Test (Queue)</span></div>
          <div class="kpi-card"><span class="kpi-value" id="metric-running" style="color: #38bdf8;">0</span><span class="kpi-label">Active Runners</span></div>
          <div class="kpi-card"><span class="kpi-value" id="metric-ready" style="color: #fbbf24;">0</span><span class="kpi-label">Ready for Execution</span></div>
          <div class="kpi-card"><span class="kpi-value" id="metric-completed" style="color: #34d399;">0</span><span class="kpi-label">Signed-Off / Done</span></div>
        </div>

        <div class="workbench-grid">
          <!-- Column 1: Queue -->
          <div class="queue-panel">
            <div class="queue-header">
              <span>Incoming Queue (<span id="queue-count">0</span>)</span>
              <button class="btn btn-fetch" style="padding:4px 8px;font-size:11px;" id="btn-sync" onclick="syncBacklog()">↻ Sync</button>
            </div>
            <div style="display:flex;gap:6px;">
              <input type="text" id="queue-add-input" value="MWPW-210873" placeholder="Key..." style="flex:1;background:#090e17;border:1px solid #1e293b;border-radius:6px;color:#fff;padding:6px 8px;font-size:12px;outline:none;" />
              <button class="btn btn-fetch" style="padding:6px 10px;" onclick="addManualTicket()">+</button>
            </div>
            <div class="queue-feed" id="queue-items-feed"></div>
          </div>

          <!-- Column 2: Focused 3-Step Work Card -->
          <div id="active-card-container">
            <div style="background:#131c31;border:1px dashed #334155;border-radius:12px;padding:48px;text-align:center;color:#94a3b8;">
              Select a ticket from the queue on the left.
            </div>
          </div>

          <!-- Column 3: Agent Companion -->
          <div class="companion-panel">
            <div class="companion-header"><span>Agent Companion</span><span style="color:#10b981;font-size:11px;">● Online</span></div>
            <div class="companion-chat" id="agent-chat-stream">
              <div class="chat-msg agent"><strong>Tattva QE Agent</strong><div style="margin-top:2px;">Live VPN active. Backlog loaded. Select any ticket to inspect diffs and execute.</div></div>
            </div>
            <div class="companion-input">
              <input id="agent-chat-input" type="text" placeholder="Ask agent..." onkeydown="if(event.key==='Enter') sendAgentChat()" />
              <button class="btn btn-fetch" style="padding:6px 10px;" onclick="sendAgentChat()">Send</button>
            </div>
          </div>
        </div>
      `;
    }

    async function loadQueue() {
      try {
        const res = await fetch('/api/tasks');
        const raw = await res.json();
        const seen = new Set();
        queueTasks = (raw || []).filter(t => {
          const k = t.jiraKey || t.id;
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });

        renderQueueFeed();
        updateMetrics();

        if (!selectedTaskId && queueTasks.length > 0) {
          selectQueueTask(queueTasks[0].id);
        } else if (selectedTaskId) {
          const current = queueTasks.find(t => t.id === selectedTaskId);
          if (current) renderActiveCard(current);
        }
      } catch (err) {
        console.error('Queue load failed:', err);
      }
    }

    function renderQueueFeed() {
      const container = document.getElementById('queue-items-feed');
      const countEl = document.getElementById('queue-count');
      if (!container) return;

      if (countEl) countEl.textContent = queueTasks.length;
      if (queueTasks.length === 0) {
        container.innerHTML = `<div style="color:#64748b;font-size:12px;text-align:center;padding:18px 0;">Queue empty. Click ↻ Sync.</div>`;
        return;
      }

      container.innerHTML = queueTasks.map(task => {
        const isSelected = task.id === selectedTaskId;
        const color = task.status === 'COMPLETED' ? '#34d399' : task.status === 'FAILED' ? '#f87171' : task.status === 'RUNNING' ? '#38bdf8' : '#fbbf24';
        return `
          <div class="queue-card ${isSelected ? 'selected' : ''}" onclick="selectQueueTask('${task.id}')">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
              <span style="font-weight:700;font-size:12px;color:#fff;">${task.jiraKey}</span>
              <span style="font-size:10px;font-weight:700;color:${color};background:rgba(255,255,255,0.06);padding:2px 5px;border-radius:4px;">${task.status}</span>
            </div>
            <div style="color:#94a3b8;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;">
              ${task.summary || 'No summary'}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b;">
              <span>${task.prNumber ? `PR #${task.prNumber}` : 'No PR'}</span>
              <span>${(task.urls || []).length} URLs</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateMetrics() {
      const inTest = queueTasks.filter(t => t.status === 'READY_TO_RUN').length;
      const running = queueTasks.filter(t => t.status === 'RUNNING').length;
      const completed = queueTasks.filter(t => t.status === 'COMPLETED' || t.status === 'SIGNED_OFF').length;

      if (document.getElementById('metric-in-test')) document.getElementById('metric-in-test').textContent = inTest;
      if (document.getElementById('metric-running')) document.getElementById('metric-running').textContent = running;
      if (document.getElementById('metric-ready')) document.getElementById('metric-ready').textContent = inTest;
      if (document.getElementById('metric-completed')) document.getElementById('metric-completed').textContent = completed;
    }

    function selectQueueTask(taskId) {
      selectedTaskId = taskId;
      renderQueueFeed();
      const task = queueTasks.find(t => t.id === taskId);
      if (task) renderActiveCard(task);
    }

    function renderActiveCard(task) {
      const container = document.getElementById('active-card-container');
      if (!container) return;

      container.innerHTML = `
        <div class="workflow-card">
          <!-- STEP 1: SCOPE -->
          <div>
            <div class="step-header">
              <div class="step-badge"><span>1</span> Scope &amp; Test Impact Analysis</div>
              <span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:#0f172a;color:#38bdf8;">${task.status}</span>
            </div>
            <div class="meta-pills">
              <span class="pill pill-jira">${task.jiraKey}</span>
              ${task.prUrl ? `<a href="${task.prUrl}" target="_blank" class="pill pill-pr">PR #${task.prNumber} ↗</a>` : ''}
              <span class="pill pill-suite">Suite: ${task.suite || 'feds-unav'}</span>
            </div>
            <h3 class="ticket-title">${task.summary}</h3>

            <div class="sub-section-title">Files Changed (Git Diff)</div>
            <div class="files-list">
              ${(task.changedFiles && task.changedFiles.length ? task.changedFiles : ['No files touched in PR yet']).map(f => `<div>• ${f}</div>`).join('')}
            </div>

            <div class="sub-section-title">Target Test Pages (${(task.urls || []).length})</div>
            <div class="url-list">
              ${(task.urls && task.urls.length ? task.urls : ['No preview URLs detected in ticket']).map(u => `
                <a href="${u}" target="_blank" rel="noopener" class="url-item">🔗 ${u}</a>
              `).join('')}
            </div>

            <div class="sub-section-title">Verification Gates</div>
            <div class="checks-list">
              ${(task.checks || []).map(c => `<label class="check-item"><input type="checkbox" checked /> <span>${c.name || c}</span></label>`).join('')}
            </div>
          </div>

          <div class="divider"></div>

          <!-- STEP 2: RUNNER -->
          <div>
            <div class="step-header">
              <div class="step-badge"><span>2</span> In-Situ Execution</div>
              <button class="btn btn-run" onclick="runExecution('${task.id}')">► Run Autonomous Checks</button>
            </div>
            <div class="execution-container">
              <div class="execution-bar">
                <span style="color:#94a3b8;">Playwright Live Worker Stream</span>
                <span id="term-status-${task.id}" style="color:${task.status==='COMPLETED'?'#4ade80':task.status==='FAILED'?'#f87171':'#38bdf8'};font-weight:700;">${task.status==='READY_TO_RUN'?'Idle':task.status}</span>
              </div>
              <div class="terminal-window" id="term-logs-${task.id}">$ waiting for task execution...</div>
            </div>
          </div>

          <div class="divider"></div>

          <!-- STEP 3: SIGN-OFF -->
          <div>
            <div class="step-header">
              <div class="step-badge"><span>3</span> Sign-Off &amp; Jira Sync</div>
            </div>
            <div class="signoff-box">
              <div>
                <div style="font-weight:700;color:#fff;">
                  ${task.status==='COMPLETED'?'Checks Passed (3/3) &bull; Ready for Sign-Off':task.status==='FAILED'?'Execution Failed (1 Blocker)':task.status==='SIGNED_OFF'?'✓ Synced to Jira':'Awaiting Execution'}
                </div>
                <div style="color:#94a3b8;font-size:11.5px;margin-top:2px;">Posts audit comment directly to ${task.jiraKey}</div>
              </div>
              <button class="btn btn-signoff" id="btn-signoff-${task.id}" style="display:${task.status==='COMPLETED'||task.status==='SIGNED_OFF'?'inline-flex':'none'};" onclick="signoffTask('${task.id}')" ${task.status==='SIGNED_OFF'?'disabled':''}>
                ${task.status==='SIGNED_OFF'?'✓ Synced':'✓ Sign-Off &amp; Post to Jira'}
              </button>
            </div>
          </div>
        </div>
      `;

      // Restore terminal logs if previously cached
      if (task.currentRunId) {
        fetch(`/api/runs/${task.currentRunId}/logs`)
          .then(r => r.json())
          .then(data => {
            if (data.logs && data.logs.length) {
              const term = document.getElementById(`term-logs-${task.id}`);
              if (term) {
                term.textContent = data.logs.join('\n');
                term.scrollTop = term.scrollHeight;
              }
            }
          });
      }
    }

    async function syncBacklog() {
      const btn = document.getElementById('btn-sync');
      if (btn) btn.textContent = 'Syncing...';
      try {
        await fetch('/api/jira/sync-backlog');
        await loadQueue();
      } catch (e) {
        console.error(e);
      } finally {
        if (btn) btn.textContent = '↻ Sync';
      }
    }

    async function addManualTicket() {
      const input = document.getElementById('queue-add-input');
      const jiraKey = input.value.trim() || 'MWPW-210873';
      input.value = '';

      const res = await fetch('/api/jira/fetch-ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jiraKey })
      });
      const data = await res.json();
      if (data.task) {
        await loadQueue();
        selectQueueTask(data.task.id);
      }
    }

    async function runExecution(taskId) {
      const termEl = document.getElementById(`term-logs-${taskId}`);
      const statusEl = document.getElementById(`term-status-${taskId}`);
      if (statusEl) statusEl.textContent = 'Running';
      if (termEl) termEl.textContent = '$ initiating Playwright worker stream...\n';

      const res = await fetch(`/api/tasks/${taskId}/execute`, { method: 'POST' });
      const data = await res.json();

      const ws = new WebSocket(`ws://${window.location.host}/${data.runId}`);
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'log' && termEl) {
          termEl.textContent += msg.data;
          termEl.scrollTop = termEl.scrollHeight;
        } else if (msg.type === 'done') {
          if (statusEl) {
            statusEl.textContent = msg.status;
            statusEl.style.color = msg.status === 'COMPLETED' ? '#4ade80' : '#f87171';
          }
          loadQueue();
        }
      };
      ws.onclose = () => loadQueue();
    }

    async function signoffTask(taskId) {
      const btn = document.getElementById(`btn-signoff-${taskId}`);
      if (btn) btn.textContent = 'Posting to Jira...';
      const res = await fetch(`/api/tasks/${taskId}/signoff`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reviewerId: 'Sneha YT' })
      });
      const data = await res.json();
      if (data.success) {
        alert('Sign-off comment posted to Jira!');
        loadQueue();
      }
    }

    async function sendAgentChat() {
      const input = document.getElementById('agent-chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const stream = document.getElementById('agent-chat-stream');
      const userMsg = document.createElement('div');
      userMsg.className = 'chat-msg user';
      userMsg.textContent = text;
      stream.appendChild(userMsg);

      const res = await fetch('/api/agent/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, taskId: selectedTaskId })
      });
      const data = await res.json();

      const agentMsg = document.createElement('div');
      agentMsg.className = 'chat-msg agent';
      agentMsg.innerHTML = `<strong>Tattva QE Agent</strong><div style="margin-top:2px;">${data.reply}</div>`;
      stream.appendChild(agentMsg);
      stream.scrollTop = stream.scrollHeight;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const initialRoute = window.location.hash.replace('#', '') || 'workbench';
      switchPage(initialRoute);
      await loadQueue();
    });
  </script>
</body>
</html>
